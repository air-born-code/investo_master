name: Weekly research

# Step 1 of the hosted pipeline: build and validate the issue, then raise a pull
# request when the output changes. This workflow deliberately never sends email.
# Delivery stays a local, human-approved action (npm run report:send:baseline),
# and scripts/send-report.mjs independently refuses to send unless the issue's
# report.json carries "approved_for_send": true.

on:
  schedule:
    # Saturday 06:00 UTC (08:00 CEST), matching the Issue 001 data cutoff day.
    # GitHub queues cron runs on a best-effort basis and can start them late.
    - cron: '0 6 * * 6'
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-research
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # The project has no dependencies and no lockfile, so there is nothing to
      # install. Add an `npm ci` step here if that ever changes.

      # Ingestion writes the numbers; the model only writes prose about them.
      # This runs before drafting so the draft sees the current week's data.
      # Append-only and idempotent, so a re-run adds nothing.
      - name: Ingest macro series
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: npm run ingest:macro

      # Filings are the higher-signal feed: they arrive irregularly and are
      # primary evidence. This records that a filing exists and links to it;
      # reading it is a research step, not an ingestion step.
      - name: Ingest SEC filings
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: npm run ingest:filings

      # Policy actions are theme-level evidence: presidential documents whose text
      # matches a tracked theme, plus large federal awards to tracked equities.
      # Needs no key. Runs after filings so the draft sees a complete store.
      - name: Ingest policy actions
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: npm run ingest:policy

      # The bridge from a theme's vocabulary to the tickers using it. Presidential
      # documents name policy and not companies, so without this the policy feed
      # cannot say who is exposed. Writes only data/theme_mentions.csv: discovery,
      # kept out of the claim registry until a name is followed and read.
      - name: Ingest theme mentions
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: npm run ingest:mentions

      # Section trackers. Both write a dated row per week so that the two newest
      # sections accumulate a series rather than being re-argued from scratch each
      # issue. Neither invents a number: the AI tracker reads the store only, and
      # the crypto tracker exits non-zero rather than estimating if its API is
      # unreachable, leaving a gap in the series instead of a wrong figure.
      - name: Track AI value-chain profit pool
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run ingest:ai

      # Allowed to fail the step without failing the week: a missed stablecoin
      # reading is a gap, not a reason to block the issue.
      - name: Track stablecoin rails
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: npm run ingest:crypto

      # Harvest reader comments left on issues already sent, BEFORE the draft runs,
      # so the model sees them and has to answer them. It must also run before the
      # issue build below, which regenerates report.md and would destroy a comment
      # written there that had not yet been recorded.
      - name: Harvest reader comments
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run comments:scan

      # Reported, not enforced. Every asset is currently incomplete by design, so
      # --strict would fail every build; the point is that the number is visible
      # in the log and in the issue rather than being rediscovered each week.
      - name: Report decision-gate completeness
        run: npm run gates:check

      # Drafting costs money, so it runs only on scheduled and manual runs —
      # never on every push. It writes prose to drafts/ and never touches
      # data/*.csv; the CSV store stays human-authored or ingested.
      - name: Draft weekly narrative
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: npm run draft:issue

      # data:build:baseline is deliberately NOT run here. It is a one-time seeder
      # that rewrites the whole store from the hardcoded Issue 001 baseline, which
      # would discard every ingested row. The CSVs come from the repository.

      # Issue 001 is rebuilt on every event as a regression gate: it must stay
      # byte-identical to the published archive.
      - name: Rebuild baseline issue (regression gate)
        run: npm run report:build:baseline

      - name: Validate baseline issue
        run: npm run report:check:baseline

      # The new week's issue depends on the draft above, so it only runs when the
      # draft did. Week and issue number are derived from the archive; rebuilding a
      # week that already has an issue reuses its number.
      - name: Build this week's issue
        id: issue
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/build-issue.mjs

      # --allow-unapproved validates structure without asserting send-readiness.
      # A fresh issue is deliberately unapproved; approval is a human step.
      - name: Validate this week's issue
        if: steps.issue.outcome == 'success'
        run: node scripts/check-report.mjs "${{ steps.issue.outputs.issue_dir }}" --allow-unapproved

      # Three or four committee seats read the built issue before a human sees it,
      # so the pull request arrives with the objections already in it. Costs money,
      # so it runs only when the draft ran. It never sends and never approves: a
      # blocking finding fails the send gate later, and the chair closes findings by
      # hand. See COMMITTEE.md.
      - name: Committee review
        if: steps.issue.outcome == 'success'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}
        run: npm run review:issue

      # Reported, not enforced, at this point in the week. The issue is unapproved
      # and unsendable regardless; this puts the open findings in the run log where
      # the reviewer of the pull request will see them.
      - name: Report open committee findings
        if: steps.issue.outcome == 'success'
        run: npm run review:list

      # The committee runs AFTER the issue is built, so the cost line written during
      # the build only ever saw the draft — and the panel is roughly 88% of what an
      # edition costs. Rebuilding here is what makes the printed figure the real one.
      # build-issue.mjs is deterministic, so this reproduces the same issue with a
      # complete cost line rather than producing a different edition.
      - name: Rebuild issue with final costs
        if: steps.issue.outcome == 'success'
        run: node scripts/build-issue.mjs

      - name: Check for changes
        id: diff
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Build output is identical to the committed tree."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short
          fi

      # Only scheduled and manual runs open a pull request. On push and
      # pull_request the steps above act purely as a CI gate.
      - name: Open pull request
        if: >-
          steps.diff.outputs.changed == 'true' &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="research/$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
          git config user.name  'investo-master-bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "Weekly research build $(date -u +%Y-%m-%d)"
          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Weekly research build $(date -u +%Y-%m-%d)" \
            --body "$(printf 'Automated build from the weekly workflow. Structural validation passed; the issue is deliberately unapproved.\n\nTo publish after reviewing the diff: set approved_for_send to true in the issue report.json, then run `npm run issue:send -- <issue directory>` locally.')"
